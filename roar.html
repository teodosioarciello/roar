<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Traduttore ROAR 🦁</title>
  <style>
    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #fff6e6, #ffe6f2);
      color: #333;
      text-align: center;
      padding: 2rem;
      overflow-x: hidden;
    }
    h1 {
      color: #cc0066;
      margin-bottom: 0.5rem;
      font-size: 2rem;
    }
    h2 {
      margin-top: 2rem;
      color: #993366;
    }
    textarea {
      width: 90%;
      max-width: 500px;
      padding: 10px;
      font-size: 1.1rem;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      resize: none;
    }
    button {
      margin-top: 15px;
      background-color: #cc0066;
      color: white;
      padding: 10px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s ease-in-out, background-color 0.2s;
    }
    button:hover {
      background-color: #b30059;
      transform: scale(1.05);
    }
    .output {
      margin-top: 20px;
      font-weight: bold;
      font-size: 1.2rem;
      color: #000;
      white-space: pre-wrap;
      min-height: 2em;
    }
    .roar-emoji {
      font-size: 3rem;
      opacity: 0;
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      top: 40%;
      animation: none;
      pointer-events: none;
    }
    @keyframes roarAnim {
      0% { opacity: 0; transform: translateX(-50%) scale(0.5); }
      20% { opacity: 1; transform: translateX(-50%) scale(1.3); }
      100% { opacity: 0; transform: translateX(-50%) scale(2); top: 10%; }
    }
    footer {
      margin-top: 3rem;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>
  <h1>Traduttore ROAR 🦁</h1>
  <p>Il linguaggio segreto creato da Diamante!</p>

  <h2>Italiano → ROAR</h2>
  <textarea id="inputIt" rows="3" placeholder="Scrivi qui in italiano..."></textarea><br />
  <button onclick="toROAR()">TRADUCI IN ROAR</button>
  <div class="output" id="outputROAR"></div>

  <h2>ROAR → Italiano</h2>
  <textarea id="inputRoar" rows="3" placeholder="Scrivi qui in ROAR..."></textarea><br />
  <button onclick="toItalian()">TRADUCI IN ITALIANO</button>
  <div class="output" id="outputIt"></div>

  <div class="roar-emoji" id="roarEmoji">🦁</div>

  <footer>Creato da Teo & Diamante ❤️</footer>

  <audio id="roarSound" src="roar.mp3" preload="auto"></audio>

  <script>
    const mapping = {
      A:'LR',B:'MA',C:'NA',D:'OA',E:'PR',F:'QA',G:'RA',H:'SA',
      I:'TR',J:'UA',K:'VA',L:'WA',M:'XA',N:'YA',O:'ZR',P:'AA',
      Q:'BA',R:'CA',S:'DA',T:'EA',U:'FR',V:'GA',W:'HA',X:'IA',
      Y:'JA',Z:'KA'
    };
    const inverse = Object.fromEntries(Object.entries(mapping).map(([k,v]) => [v,k]));

    const roarSound = document.getElementById("roarSound");
    const roarEmoji = document.getElementById("roarEmoji");

    function playRoar() {
      roarSound.currentTime = 0;
      roarSound.play();
      roarEmoji.style.animation = "none";
      // force reflow
      void roarEmoji.offsetWidth;
      roarEmoji.style.animation = "roarAnim 1.5s ease-out";
    }

    function toROAR() {
      const text = document.getElementById("inputIt").value;
      let encoded = "";
      for (let ch of text) {
        const upper = ch.toUpperCase();
        encoded += mapping[upper] || ch;
      }
      // Regola: rimuovi vocali consecutive
      encoded = encoded.replace(/([AEIOU])\1+/g, '$1');
      document.getElementById("outputROAR").innerText = encoded;
      playRoar();
    }

    function toItalian() {
      const text = document.getElementById("inputRoar").value;
      let decoded = "";
      let i = 0;
      while (i < text.length) {
        const pair = text[i].toUpperCase() + (text[i+1] ? text[i+1].toUpperCase() : "");
        if (inverse[pair]) {
          decoded += inverse[pair].toLowerCase();
          i += 2;
        } else {
          decoded += text[i];
          i += 1;
        }
      }
      document.getElementById("outputIt").innerText = decoded;
      playRoar();
    }
  </script>
</body>
</html>
